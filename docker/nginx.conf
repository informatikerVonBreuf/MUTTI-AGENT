# Folio — frontend nginx (non root, port 8080).

# HSTS seulement quand la connexion arrive en HTTPS (valeur vide = en-tête non envoyé).
map $https $folio_hsts {
  on      "max-age=31536000; includeSubDomains";
  default "";
}

# Déni de service : débit et connexions simultanées par adresse IP (le serveur Node applique ses propres limites).
limit_req_zone $binary_remote_addr zone=folio_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=folio_auth:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=folio_conn:10m;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 64k;
  limit_conn folio_conn 30;
  limit_req_status 429;
  limit_conn_status 429;
  # Connexions lentes (type Slowloris) coupées.
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 15s;

  # Compression des fichiers statiques et des réponses JSON (aucun secret n'est renvoyé dans un corps de réponse).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/markdown;

  # Pas de script en ligne, pas d'eval ; le PDF des rapports est intégré depuis la même origine.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; worker-src 'self' blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security $folio_hsts always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/auth/ {
    limit_req zone=folio_auth burst=15 nodelay;
    proxy_pass http://backend:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /api/ {
    limit_req zone=folio_api burst=60 nodelay;
    proxy_pass http://backend:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; worker-src 'self' blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security $folio_hsts always;
  }
}
